# Product-OS Schema — v1
#
# The persistent product model. One of the three things ProductOS keeps forever:
# STRUCTURE. The tree is always exactly three levels:
#   Domain -> Capability -> Functionality
#
# Nodes link by id. ICE, Decisions, Personas, and Journeys attach to nodes by
# reference (their own schemas).

schema:
  name: product-os
  version: 1

# ---- Node shape -------------------------------------------------------------
node:
  id: string              # opaque, stable id — never changes once assigned
  path: string            # human-readable path, derived from names; may change
                          # on rename/reparent, e.g.
                          # order-management.checkout.guest-checkout
  type: string            # one of: domain | capability | functionality
  name: string            # human label, e.g. "Guest Checkout"
  summary: string         # one-line description
  parent: string          # parent node id; null only for a domain
  depends_on: [string]    # ids of OTHER nodes this node needs (cross-tree
                          # dependency lives in STRUCTURE, not in ICE)
  status: string          # one of: proposed | active | deprecated
  ice_ref: string         # id of this node's ICE record (null until seeded)
  decision_refs: [string] # ids of decisions (ADRs) affecting this node
  journey_refs: [string]  # ids of journeys linked to this node
  priority: integer       # DEPRECATED for v1 — /roadmap now plans SLICES, not nodes
                          # (see slice.yaml: order/effort/depends_on on the slice).
                          # Left for back-compat; null on the node.
  metadata:
    created_by: string
    updated_by: string
    version: integer

# ---- Tree rules -------------------------------------------------------------
structure:
  levels: [domain, capability, functionality]   # exactly 3, in this order
  domain:        { parent: none,       child: capability }
  capability:    { parent: domain,     child: functionality }
  functionality: { parent: capability, child: none }

# ---- Persona record (persistent, attached to a node) -----------------------
# A persona is WHO the work is for. It is first-class grounding, not decoration: an
# ICE record names its personas by reference (ice.yaml `context.persona: []`), so an
# intent that says what should be true points HERE for whom it should be true. Both
# /understand and /shape write persona records. Structured content (goals /
# cares_about / failure_means) exists so downstream plays READ the person's goals
# rather than re-derive them from prose differently every run.
persona:
  id: string
  name: string            # e.g. "Guest shopper on mobile"
  description: string     # ONE-LINE prose: who they are. Nothing else — their goals,
                          # trust criteria and failure bar live in the fields below,
                          # so this field does not drift back into carrying everything.
  node_ref: string        # node (usually capability) this persona belongs to

  # ---- Structured grounding ----
  # ADDITIVE and OPTIONAL: a record written before issue #550 that carries only
  # `description` stays valid, and nothing rewrites it. Every persona written from
  # now on should carry all three — the writing play (/understand, /shape) fills
  # them. Nothing ERRORS on them; /shape's validator WARNS when one is missing (see the
  # migration note below for the full validation truth).
  goals: [string]         # what this person is trying to achieve — outcomes in THEIR
                          # words, never features or solutions
  cares_about: [string]   # what they judge the thing by when deciding whether to
                          # trust it
  failure_means: string   # what makes the thing a failure for THEM specifically — the
                          # bar a downstream play checks itself against to know it missed

  metadata:
    created_by: string
    version: integer

# ---- Migration note: structured persona grounding (issue #550) --------------
# Added: `goals`, `cares_about`, `failure_means` on the persona record; `id`, `name`,
#   `description`, `node_ref` and `metadata` are unchanged.
# Additive and optional: no existing persona record breaks — one carrying only
#   `description` remains valid exactly as written.
# Bringing an existing record up to shape: split the three fields OUT of the prose
#   already sitting in `description` (it typically crams who-they-are, what-they-need
#   and what-they-must-trust into one sentence), and leave `description` behind as the
#   one-line who-they-are summary. Done by hand, or by the writing play the next time
#   it touches that persona. No script performs this migration.
# Validation truth — claim nothing more: `core/components/plays/shape/scripts/validate_shape.py`
#   ERRORS on only `id` and `name`; `description` and `node_ref` are checked by nothing.
#   The three new fields are WARNINGS there (#550): the script reads them and warns when a
#   persona lacks one, so a newly written record is visibly incomplete, but the run still
#   passes — which is what keeps pre-#550 records valid. /shape's own eval (SE-4) turns a
#   warning into a gap ONLY for a persona that run actually wrote. Nothing errors on them,
#   and no other validator or linter reads them at all.
# Status of this note: it IS the migration record that `enhance_rules` /
#   `schemas/product-os/_index.md` ask for when a permanent record type changes. It is
#   NOT a substitute for the parked schema-evolution play, which still owns versioned
#   migration when it exists.

# ---- Journey record (persistent, attached to a node) -----------------------
# A journey is a USER journey: the ordered steps a persona takes ON a surface to reach
# an outcome. It is NOT a backend or ingestion pipeline. Every journey traverses at
# least one surface (surface_refs), and every surface a slice names must be reached by
# at least one journey. /shape enforces both (C15).
journey:
  id: string
  name: string            # e.g. "First-time guest checkout"
  persona_ref: string     # whose journey
  node_ref: string        # node (usually capability) this journey belongs to
  surface_refs: [string]  # the slice surface id(s) this journey runs on — REQUIRED, >=1
  steps: [string]         # ordered steps the persona takes ON those surfaces
  metadata:
    created_by: string
    version: integer

# ---- Fill rules: which play writes which part ------------------------------
fill_rules:
  - play: "/vision"
    writes: "domain + candidate capability nodes (directional, from intent), a
             seed ice_ref, and a directional draft product profile"
  - play: "/understand"
    writes: "nothing on the node itself — enriches the linked ICE record,
             including each capability's nfr_needs, which roll the product
             profile up to state: derived"
  - play: "/shape"
    writes: "profile-driven selection: confirm/prune capabilities and select
             functionalities against the profile + KB, plus personas, journeys.
             ALSO writes the domain's SLICES (slice.yaml) — bundling its
             functionalities into usable increments, referencing their ICE — plus the
             _deferred bucket. Re-runs when the profile changes."
  - play: "/roadmap"
    writes: "the PLAN onto slices (slice.yaml): order, effort, resolved depends_on,
             across all shaped domains. It does NOT write node.priority (deprecated)
             and does NOT create/edit slice composition (that is /shape's)."
  - play: "/learn"
    writes: "status changes driven by real-world outcomes"

# Pipeline ordering: /vision is directional (capabilities + draft profile) ->
# /understand rolls up the smart profile from capability nfr_needs ->
# /shape selects capabilities + functionalities against the now-derived profile.
# So the profile always exists before functionalities are selected. The loop is
# re-entrant: as intent/profile evolves (climbing the architecture ladder),
# /shape re-selects.

# ---- Enhance rules: who may change THIS schema -----------------------------
enhance_rules:
  governed_by: "PARKED — a dedicated schema-evolution play will own this; it
                implies migrating existing records to the new shape"
  immutable_in_v1: [structure.levels]   # the 3-level shape is fixed for v1

# ---- Storage layout (the product-os folder) --------------------------------
# Two lifecycle tiers live here:
#   PERMANENT  — structure, ICE, decisions, the 5 lenses, and epics: epics are
#                written by /grill and stamped `delivered` (kept) when their issue
#                merges — the as-delivered record, never deleted (ADR 019).
#   (STM, NOT here) — stories, tests, build detail produced by /implement.
#
# Per-capability shape:
#   product-os/{capability}/
#     node.yaml                      # the capability node (this schema)
#     ice.yaml                       # capability ICE (ice schema)
#     lens/                         # the 5 lenses (PERMANENT)
#       ux.yaml architecture.yaml run.yaml quality.yaml agentic.yaml
#     decisions/                     # decision (ADR) records
#     personas/  journeys/           # persona + journey records
#     functionalities/{functionality}/
#       node.yaml  ice.yaml          # functionality node + its build-unit ICE
#     epics/                         # PERMANENT — vertical slices awaiting/under
#                                    # delivery; stamped `delivered` and kept on
#                                    # their issue merge (ADR 019)

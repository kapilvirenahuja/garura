# Lens: ux  (LOCKED #434) — shared envelope in lens/_index.md
#
# Scope (#434): the ux lens drives INTENT, not a full spec. It anchors the experience
# with just enough that the build can figure the rest on the fly:
#   - screens (each naming the one object the user works with there, with a low-fidelity
#     layout) that make the shaped slices visible,
#   - the flows — per persona and goal, the ordered path through those screens,
#   - the states each screen can hold, each with the trigger that puts it there,
#   - the product's visual core (color + typography).
# Accessibility is NOT restated here — it lives in the product profile, and the build
# connects it. The flows here are the paths INSIDE this lens's screens; the person's wider
# journey across the product is not this lens's to write (that is /story's, #528). (#548)

schema:
  name: lens
  type: ux

content:
  screens:              # the surfaces this capability needs, made visible to validate the shape
    - name: string
      purpose: string
      object: string    # the ONE thing the user works with on this screen — this is where
                        # the information architecture lives (no separate IA section)
      layout: string    # low-fidelity layout — the blocks/regions on the screen and what
                        # each holds (where the slice's functionality sits). NOT pixel design.
  flows:                # per persona + goal: the ordered path through the screens above
    - persona: string   # who is taking this path — traces to a persona/journey of the hub
      goal: string      # what they are trying to get done
      entry: string     # where the path starts
      steps:            # ordered; each step names a screen from `screens` above
        - screen: string
          action: string
      decisions:        # each fork point, and where EACH branch goes
        - at: string    # the step the fork happens at
          branches: [string]
      failure: string   # what happens when a step fails
      exit: string      # where the person ends up
  states:               # per screen
    - screen: string
      states:           # each state names what puts the screen in it
        - name: string  # idle | submitting | error | locked | success | empty | loading
          trigger: string
          sees: string
          next: string
  design_system:        # the product's visual core (set once, referenced by every capability)
    palette: string     # the core colors + mood (e.g. "ink #11181C on paper #FCFCFD, brand teal #0E7C86")
    typography: string  # the type character (e.g. "Inter for UI, Spectral for long-form")

category: harness
grounded_principles:
  - id: P-PIPELINE-INTENT
    statement: >
      An intent change (anything touching what a play decides or guarantees — intent
      statement, constraints, failure conditions, scenarios, agent/skill flow, evals) MUST
      go through the play's ICE source (reference/ice.md) and be recompiled with
      /play-editor. Hand-editing a compiled SKILL.md for an intent change is forbidden
      ("Never hand-edit a compiled SKILL.md for an intent change"). No carve-out is stated
      for play-editor being interactive-only.
    source: "CLAUDE.md (committed on main, unchanged by this PR) — 'Play Pipeline Rules'"
  - id: P-AGENT-CONTEXT-SKILL-ARTIFACT
    statement: >
      Agents craft context (discover/resolve what's relevant, hand it to skills); skills
      execute and produce artifacts. Skills do not discover context themselves — the agent
      hands them the paths. This is the boundary between the two roles.
    source: "docs/philosophy/architecture.md:165, :308 (base ref, unchanged by this PR)"
  - id: P-DIRECT-MODEL-WRITE
    statement: >
      Every model-writing play (including /ux and /shape) writes the live product model
      directly in place; the LLM skill writes only per-node docs/records, a keyed
      deterministic script owns every shared-file mutation, and the checkpoint is
      write-then-review with commit only after an approved gate.
    source: "core/components/memory/standards/rules/direct-model-write.md (base ref); ADR 026 (docs/adr/026-direct-to-model-writes.md)"
  - id: P-STRUCTURAL-CONFORMANCE
    statement: >
      A play's compiled SKILL.md must pass lint_play.py (section presence, failure/
      constraint/scenario coverage, 1:1 recovery, no orphan refs, a real intent
      fingerprint) as the mechanical Layer-1 gate underneath any design judgement.
    source: "core/components/plays/play-editor/scripts/lint_play.py (base ref, unchanged logic)"

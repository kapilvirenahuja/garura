# Category: harness only. Grounded exclusively from committed sources (base ref `main`,
# CLAUDE.md, memory/standards/rules/**). No principle below is sourced from content the
# diff adds or rewrites.

category: harness
task_id: null

grounded_principles:
  - id: PPR-1
    principle: >
      A play change is one of two kinds. An INTENT change (touching the intent statement,
      constraints C-, failure conditions F-, scenarios S-, the agent/skill flow, or evals)
      MUST go through the play's ICE source (reference/ice.md) and be recompiled via
      /play-editor — never a hand-patch of the compiled SKILL.md. A non-intent change is a
      direct edit to the compiled SKILL.md with a recorded deviation-note footer.
    source: "CLAUDE.md (main, unchanged by this diff) — 'Play Pipeline Rules' section"

  - id: PPR-2
    principle: >
      To modify a compiled play, update reference/ice.md and recompile with play-editor;
      the compiled SKILL.md is a compiled artifact and must not be edited manually.
    source: "core/components/plays/ux/SKILL.md at main (git show main:core/components/plays/ux/SKILL.md), 'This play was compiled from the ux ICE...Do NOT edit this file manually' line"

  - id: PPR-3
    principle: >
      Every failure condition must have exactly one recovery entry (1:1), every failure has
      a step eval, every scenario has a scenario eval, every constraint appears in pre-flight
      or a step eval, and there must be no references to undeclared C/F/S ("no orphans").
      These are the mechanical gates enforced by lint_play.py (the compiler's own linter,
      itself a committed, unedited-by-this-diff script).
    source: ".claude/skills/play-editor/scripts/lint_play.py (unmodified by this diff; run directly against the branch's compiled SKILL.md)"

  - id: PPR-4
    principle: >
      Agents hold the role of context crafting only — their job is to gather context and put
      it on files; the actual work is done by skills, which agents invoke. An agent's routing
      table describes what a skill does; it does not do the skill's work itself.
    source: "CLAUDE.md (main, unchanged by this diff), Behavioral Rule 4 — 'Agents hold the role of Context Crafting'"

  - id: PPR-5
    principle: >
      The User-Facing Voice rule governs replies the harness makes TO THE USER (checkpoints,
      summaries, status updates, close reports, ad-hoc conversation) — not the internal
      artifact templates a play instructs its sub-agents to produce. Extending it to
      artifact templates was explicitly explored and dropped.
    source: "core/components/memory/standards/rules/user-facing-voice.md (main, unchanged by this diff) — 'Scope' section"


  severity: P4
  file: core/components/memory/standards/schemas/product-os/grounding/lens/ux.md
  finding: 'The gold example''s Flows section covers only the dashboard-operator persona''s
    goal, even though the Screens section names the CTO as a second, independent opener
    of the Source coverage view (for a distinct goal — judging trust directly, not
    preparing the review). The contract''s stated completeness check ("every screen
    reached by at least one flow step") is satisfied because the operator''s flow
    happens to touch both screens, but the gold example does not itself demonstrate
    a second persona+goal block, which is otherwise the norm the contract sets ("A
    persona chasing two different goals gets two blocks"). Noted as a nit, not a contract
    violation — the contract only mandates screen-reachability, not per-named-opener
    flow coverage.

    '

  file: core/components/memory/standards/schemas/product-os/lens/ux.yaml
  finding: 'The migration note the fix commit added (lines following "Schema evolution
    note (#548)") makes two factual claims that do not hold up, checked against committed
    sources: (a) "the structural linter fails the old shape until it does [rerun]"
    -- there is no structural linter for a live `lens/ux.yaml` DATA record at all.
    `lint_grounding.py` only checks the heading structure of the prose `ux.md`; `validate_ux.py
    --lens` takes the `.md` file, not any yaml, for its C14/F15 flow cross-check;
    and persist_ux.py''s own docstring confirms no `lens/ux.yaml` is ever written
    to a live product ("it does NOT copy the lens"). So there is no enforcement mechanism
    this claim can be pointing to -- it asserts a safety net that does not exist,
    which could lead a future reader to believe an old-shape record would be caught
    mechanically when nothing catches it. (b) "This repo holds no record under the
    prior shape" -- literally false: a file at the exact path pattern `lens/ux.yaml`,
    in the OLD shape (`states: [string]`, no `screens[].object`, `flows` keyed by
    `name`/`persona_ref` rather than `persona`/`goal`), exists at `.garura/project/issues/434/specs/schemas-v1/lens/ux.yaml`
    -- the original issue #434 design spec draft. It is a historical project-spec
    artifact, not a live product/slice record, so the claim is defensible if read
    charitably as "no LIVE product record" -- but as literally written it is inaccurate,
    and the note does not scope the claim that way. Both are new inaccuracies introduced
    by the fix commit itself (not present before eac57906), so they are chargeable
    to this PR.

    '

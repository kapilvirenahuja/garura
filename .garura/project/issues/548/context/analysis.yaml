      one group (the same class of edit as #546's SKILL.md deviation note, except here it's a
      full recompile, not a direct-edit).

      (2) the memory-side lens contract — schemas/product-os/grounding/lens/ux.md (the human
      template + heading contract, now Intent/Screens/Flows/States/Visual core) and
      schemas/product-os/lens/ux.yaml (the machine schema, now carrying `flows:` and
      `object:`/`trigger:` fields) are the same contract in two forms (prose template + typed
      schema) — verified both diffs add the identical concept (flows, object, trigger) — so one
      group.

      (3) the ten bundled `lint_grounding.py` copies — diffed the ux copy and the agentic copy
      byte-for-byte identical: a single-line change to the `lens-ux` CONTRACTS entry adding
      "Flows" to the h2 list. This is the same generated change stamped once per play (bundling
      artifact of the play-compiler, not ten independent decisions), kept as one chore group per
      the plan contract's instruction to group by real concern, not by folder.

      (4) validate_ux.py — read the diff: adds a wholly new mechanical cross-check (screen/flow
      reachability, decision-branch completeness) satisfying the new C14/F15 constraints from
      group (1)'s ice.md. This is substantial new logic (not a doc/template change), kept as its
      own feat group distinct from (1) because it's a different artifact class (script vs

      (5) author-ux-lens/SKILL.md + product-os-keeper.md — the authoring skill's process steps
      now include "Draw the flows" as step 3, and the agent's own routing table/trigger-phrase
      row for author-ux-lens was updated to mention flows. Read both diffs: product-os-keeper.md
      only touches the two lines describing author-ux-lens (no other agent content changed), so
      it travels with the skill it dispatches, not as a separate group.

      (6) the two untracked STM files under .garura/project/issues/548/context/ (this skill's own
      scan output, analysis.yaml + porcelain.txt) are run artifacts, not part of the code change,
      split into their own chore(stm) group last per the plan contract.

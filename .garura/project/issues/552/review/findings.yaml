  - id: C-3
    category: code
    severity: P4
    file: core/components/plays/ux/scripts/render_wireframes.py
    where: "render_markup(), pin branch, line 81"
    says: >
      The pin branch re-escapes already-escaped content, so a pin carrying text renders
      double-escaped ('Tom & Jerry' -> 'Tom &amp;amp; Jerry'). Cosmetic, never under-escaped,
      so not a security issue. Downgraded from the reviewer's P3: a pin is specified to hold a
      NUMBER, so this fires only on misuse.
    basis: "pr.md P4 (cosmetic, non-blocking)"
    verified_by: "orchestrator ran render_markup directly on five inputs; only the text-pin case misbehaves"

  - id: C-4
    category: code
    severity: P4
    file: core/components/plays/ux/scripts/render_wireframes.py
    where: "render_markup(), nested markup"
    says: >
      Nested markup is silently mangled rather than rejected: '[[ok:a & b [[pin:2]] c]]'
      renders as '<span class="ok">a &amp; b [[pin:2</span> c]]'. Either support nesting or
      reject it with a finding; malformed output is the wrong third option.
    basis: "review/code.md rubric — malformed output must not pass silently; pr.md P4"
    verified_by: "orchestrator reproduced directly"
    note: "found by the orchestrator during verification; not reported by any reviewing agent"

